# Benchmark data generation config

# Dataset sizes for a local benchmark run.
# Increase these values or use your own config for long runs.
users: 10000
orders: 50000
order_items: 150000
products: 10000
categories: 1000

# Batch settings
batch_size: 10000
workers: 4

# Time range for generated data (days)
time_range_days: 365

# Random seed for reproducibility
seed: 42
